<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      body {
        margin: 0;
        padding: 44px;
        background: #f3f2ec;
        color: #22261f;
        font-family: system-ui, sans-serif;
      }
      h1 {
        font-size: 36px;
        line-height: 1.1;
        font-weight: 500;
        letter-spacing: -1.5px;
        max-width: 420px;
      }
      p {
        font-size: 15px;
        line-height: 1.6;
        max-width: 430px;
      }
      .chart {
        height: 130px;
        display: flex;
        gap: 16px;
        align-items: end;
        margin: 30px 0;
      }
      .bar {
        background: #48705d;
        flex: 1;
      }
      .stat {
        font-size: 50px;
        letter-spacing: -3px;
        font-weight: 500;
        margin-bottom: 8px;
      }
      footer {
        font-size: 13px;
        margin-top: 28px;
      }
    </style>
  </head>
  <body>
    <p>Release report</p>
    <h1>Smaller releases.<br />More often.</h1>
    <p>
      A sample engineering report showing how a team’s release rhythm changed
      over six weeks.
    </p>
    <div
      class="chart"
      aria-label="Example release count per week: 2, 3, 3, 5, 6, 8"
    >
      <div class="bar" style="height: 25%"></div>
      <div class="bar" style="height: 38%"></div>
      <div class="bar" style="height: 38%"></div>
      <div class="bar" style="height: 63%"></div>
      <div class="bar" style="height: 75%"></div>
      <div class="bar" style="height: 100%"></div>
    </div>
    <p>Week one to week six. Illustrative data.</p>
    <footer>Sample document. No customer data.</footer>
  </body>
</html>
