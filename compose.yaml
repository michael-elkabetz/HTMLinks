# Preserve the Compose project identity so upgrades reuse existing volumes.
name: hstore
x-app: &app
  image: ${HTMLINKS_IMAGE:-ghcr.io/michael-elkabetz/htmlinks:0.1.0}
  init: true
  restart: unless-stopped
  env_file: .env
  environment: &environment
    DATABASE_URL: postgres://hstore:${POSTGRES_PASSWORD:?Run sh setup.sh first}@db:5432/hstore
    STORAGE_PATH: /app/data/uploads
  depends_on:
    migrate:
      condition: service_completed_successfully
  volumes:
    - uploads:/app/data/uploads
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hstore
      POSTGRES_DB: hstore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run sh setup.sh first}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hstore -d hstore"]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    <<: *app
    restart: "no"
    healthcheck:
      disable: true
    command: ["node", "scripts/migrate.mjs"]
    depends_on:
      db:
        condition: service_healthy
  web:
    <<: *app
    environment:
      <<: *environment
    ports:
      - "127.0.0.1:${HTMLINKS_PORT:-${HSTORE_PORT:-3000}}:3000"
  maintenance:
    <<: *app
    command: ["node", "scripts/maintenance.mjs", "--loop"]
    healthcheck:
      disable: true
volumes:
  postgres:
  uploads:
