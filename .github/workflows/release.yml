name: Release Docker images
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.version.outputs.image }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
      - name: Validate version and package deployment files
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/package-deployment.mjs --version "$RELEASE_TAG"
          version="${RELEASE_TAG#v}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: deployment
          path: |
            release/*.tar.gz
            release/SHA256SUMS
  checks:
    needs: validate
    uses: ./.github/workflows/check.yml
    with:
      upload-images: true
  publish:
    needs: [validate, checks]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-${{ matrix.arch }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image
        env:
          IMAGE: ${{ needs.validate.outputs.image }}
          VERSION: ${{ needs.validate.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          zstd -d image.tar.zst --stdout | docker load
          docker tag htmlinks:check "$IMAGE:$VERSION-$ARCH"
          docker push "$IMAGE:$VERSION-$ARCH"
  manifest:
    needs: [validate, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble the multi-platform release
        env:
          IMAGE: ${{ needs.validate.outputs.image }}
          VERSION: ${{ needs.validate.outputs.version }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:$VERSION" "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
          if [ "$PRERELEASE" = false ]; then
            docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$VERSION"
          fi
          docker buildx imagetools inspect "$IMAGE:$VERSION"
      - uses: actions/download-artifact@v4
        with:
          name: deployment
          path: release
      - name: Create GitHub release with deployment bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.validate.outputs.version }}
          IMAGE: ${{ needs.validate.outputs.image }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          printf 'Run HTMLinks using Docker Compose without Node.js or a source checkout. Download and extract the deployment archive, then follow its README.\n\nImage: `%s:%s` (linux/amd64 and linux/arm64).\n\nVerify the archive against SHA256SUMS. Existing installations: back up the database, uploaded HTML, and instance secrets before following the upgrade instructions.\n' "$IMAGE" "$VERSION" > release-notes.md
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" release/*.tar.gz release/SHA256SUMS --verify-tag --title "HTMLinks $VERSION" --notes-file release-notes.md --generate-notes "${flags[@]}"
